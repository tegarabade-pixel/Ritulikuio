name: Secure RustDesk (Public Repo) v2

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: secure-rustdesk
  cancel-in-progress: true

jobs:
  rustdesk:
    runs-on: windows-latest
    timeout-minutes: 360
    environment: rdp

    steps:
      - name: Connect runner to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: gh-rustdesk
          log-mode: quiet

      - name: Install and configure RustDesk
        shell: pwsh
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:RUSTDESK_PASSWORD)) {
            throw 'RDP_PASSWORD environment secret is missing.'
          }
          if ($env:RUSTDESK_PASSWORD.Length -lt 12) {
            throw 'RDP_PASSWORD must be at least 12 characters.'
          }
          Write-Output "::add-mask::$env:RUSTDESK_PASSWORD"

          $tsIP = (tailscale ip -4 | Select-Object -First 1).Trim()
          if (-not $tsIP) {
            throw 'Tailscale IPv4 address was not assigned.'
          }

          Write-Host 'Downloading latest RustDesk x86-64 MSI...'
          $headers = @{ 'User-Agent' = 'GitHub-Actions-RustDesk-Setup' }
          $release = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/rustdesk/rustdesk/releases/latest'
          $asset = $release.assets |
            Where-Object { $_.name -match '^rustdesk-.*-x86_64\.msi$' } |
            Select-Object -First 1

          if (-not $asset) {
            throw 'Could not find the RustDesk Windows x86-64 MSI in the latest release.'
          }

          $msi = Join-Path $env:RUNNER_TEMP 'rustdesk.msi'
          $msiLog = Join-Path $env:RUNNER_TEMP 'rustdesk-msi.log'
          Invoke-WebRequest -Headers $headers -Uri $asset.browser_download_url -OutFile $msi

          Write-Host "Installing RustDesk $($release.tag_name) with MSI..."
          $msiArgs = "/i `"$msi`" /qn /norestart INSTALLPRINTER=N CREATESTARTMENUSHORTCUTS=N CREATEDESKTOPSHORTCUTS=N /l*v `"$msiLog`""
          $p = Start-Process -FilePath 'msiexec.exe' -ArgumentList $msiArgs -PassThru

          if (-not $p.WaitForExit(180000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Write-Host '=== MSI LOG (tail) ==='
            Get-Content $msiLog -Tail 120 -ErrorAction SilentlyContinue
            throw 'RustDesk MSI installation timed out after 3 minutes.'
          }

          if ($p.ExitCode -notin @(0, 3010)) {
            Write-Host '=== MSI LOG (tail) ==='
            Get-Content $msiLog -Tail 120 -ErrorAction SilentlyContinue
            throw "RustDesk MSI failed with exit code $($p.ExitCode)."
          }

          $candidates = @(
            'C:\Program Files\RustDesk\rustdesk.exe',
            'C:\Program Files (x86)\RustDesk\rustdesk.exe'
          )
          $rustdesk = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $rustdesk) {
            throw 'RustDesk executable was not found after MSI installation.'
          }

          $service = $null
          for ($i = 0; $i -lt 30; $i++) {
            $service = Get-Service -Name 'RustDesk' -ErrorAction SilentlyContinue
            if ($service) { break }
            Start-Sleep -Seconds 2
          }
          if (-not $service) {
            throw 'RustDesk Windows service was not created by the MSI.'
          }

          Set-Service -Name 'RustDesk' -StartupType Automatic
          Start-Service -Name 'RustDesk' -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 6

          # Permanent password (secret is never printed).
          & $rustdesk --password $env:RUSTDESK_PASSWORD | Out-Null
          Start-Sleep -Seconds 2

          # Installed RustDesk uses the LocalService profile.
          Stop-Service -Name 'RustDesk' -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          $configDir = 'C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\RustDesk\config'
          New-Item -ItemType Directory -Path $configDir -Force | Out-Null
          $configFile = Join-Path $configDir 'RustDesk2.toml'

          $configLines = @(
            "rendezvous_server = '127.0.0.1:21116'"
            'nat_type = 1'
            'serial = 0'
            ''
            '[options]'
            "direct-server = 'Y'"
            "direct-access-port = '21118'"
            "approve-mode = 'password'"
            "verification-method = 'use-permanent-password'"
            "allow-logon-screen-password = 'Y'"
            "allow-only-conn-window-open = 'N'"
            "enable-lan-discovery = 'N'"
            "whitelist = '100.64.0.0/10'"
            "enable-keyboard = 'Y'"
            "enable-clipboard = 'Y'"
            "enable-file-transfer = 'Y'"
            "enable-audio = 'Y'"
          )
          Set-Content -Path $configFile -Value $configLines -Encoding UTF8

          # Disable broad RustDesk firewall entries and only allow Tailscale peers.
          Get-NetFirewallRule -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like '*RustDesk*' } |
            Disable-NetFirewallRule -ErrorAction SilentlyContinue

          Get-NetFirewallRule -DisplayName 'RustDesk via Tailscale' -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule -ErrorAction SilentlyContinue

          New-NetFirewallRule -DisplayName 'RustDesk via Tailscale' `
            -Direction Inbound -Action Allow -Protocol TCP -LocalPort 21118 `
            -LocalAddress $tsIP -RemoteAddress '100.64.0.0/10' -Profile Any | Out-Null

          Start-Service -Name 'RustDesk'
          Start-Sleep -Seconds 6

          # Re-apply password to the installed/service instance.
          & $rustdesk --password $env:RUSTDESK_PASSWORD | Out-Null
          Restart-Service -Name 'RustDesk' -Force
          Start-Sleep -Seconds 6

          $listener = Get-NetTCPConnection -LocalPort 21118 -State Listen -ErrorAction SilentlyContinue
          if (-not $listener) {
            Write-Host '=== RustDesk service ==='
            Get-Service -Name 'RustDesk' | Format-List | Out-String | Write-Host
            Write-Host '=== TCP listeners ==='
            Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue |
              Where-Object { $_.LocalPort -in @(21118,21116,21117,21119) } |
              Format-Table -AutoSize | Out-String | Write-Host
            Write-Host '=== RustDesk config ==='
            Get-Content $configFile -ErrorAction SilentlyContinue
            throw 'RustDesk direct-access listener did not open on TCP 21118.'
          }

          Write-Host ''
          Write-Host '=== RUSTDESK READY ==='
          Write-Host 'Tailscale hostname : gh-rustdesk'
          Write-Host "Tailscale IPv4     : $tsIP"
          Write-Host "RustDesk endpoint  : ${tsIP}:21118"
          Write-Host 'Password           : use RDP_PASSWORD Environment secret'
          Write-Host 'Connection         : Tailscale direct IP only'
          Write-Host '======================='

      - name: Keep RustDesk session available
        shell: pwsh
        run: |
          for ($i = 1; $i -le 69; $i++) {
            Write-Host "[$(Get-Date -Format o)] RustDesk session active ($i/69)"
            Start-Sleep -Seconds 300
          }
          
