name: Secure Windows RDP 60FPS (Public Repo)

on:
  workflow_dispatch:

# The workflow does not need access to repository contents or write permissions.
permissions: {}

concurrency:
  group: secure-windows-rdp
  cancel-in-progress: true

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    environment: rdp

    steps:
      - name: Connect runner to Tailscale
        # tailscale/github-action v4.1.3 pinned to an immutable commit.
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: gh-rdp
          log-mode: quiet

      - name: Configure secure optimized Windows RDP
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw 'RDP_PASSWORD Environment secret is missing.'
          }
          if ($env:RDP_PASSWORD.Length -lt 14) {
            throw 'RDP_PASSWORD must be at least 14 characters.'
          }

          # Extra masking in addition to GitHub Secrets masking.
          Write-Output "::add-mask::$env:RDP_PASSWORD"

          $username = 'rdpuser'
          $securePass = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          # Create/reset the temporary Windows account.
          $existing = Get-LocalUser -Name $username -ErrorAction SilentlyContinue
          if ($null -eq $existing) {
            New-LocalUser -Name $username -Password $securePass `
              -AccountNeverExpires -PasswordNeverExpires | Out-Null
          } else {
            Set-LocalUser -Name $username -Password $securePass
          }

          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member $username -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group 'Administrators' -Member $username -ErrorAction SilentlyContinue

          # ------------------------------------------------------------------
          # RDP security
          # ------------------------------------------------------------------
          $tsPath = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server'
          $rdpTcp  = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
          $policy  = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          $fpsKey  = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations'

          New-Item -Path $policy -Force | Out-Null

          # Enable RDP.
          Set-ItemProperty -Path $tsPath -Name 'fDenyTSConnections' -Type DWord -Value 0 -Force

          # Require NLA and TLS.
          Set-ItemProperty -Path $rdpTcp -Name 'UserAuthentication' -Type DWord -Value 1 -Force
          Set-ItemProperty -Path $rdpTcp -Name 'SecurityLayer' -Type DWord -Value 2 -Force

          # ------------------------------------------------------------------
          # 60 FPS ceiling
          # Microsoft documents DWMFRAMEINTERVAL=15 (decimal) as a 60 FPS max.
          # It raises the ceiling; actual FPS still depends on CPU/network/client.
          # ------------------------------------------------------------------
          New-ItemProperty -Path $fpsKey -Name 'DWMFRAMEINTERVAL' `
            -PropertyType DWord -Value 15 -Force | Out-Null

          # ------------------------------------------------------------------
          # Transport / latency
          # SelectTransport=2 = allow either UDP or TCP.
          # UDP is important for interactive RDP when the client/network supports it.
          # ------------------------------------------------------------------
          New-ItemProperty -Path $policy -Name 'SelectTransport' `
            -PropertyType DWord -Value 2 -Force | Out-Null

          # Automatic reconnection if the mobile link briefly changes.
          New-ItemProperty -Path $policy -Name 'fDisableAutoReconnect' `
            -PropertyType DWord -Value 0 -Force | Out-Null

          # Remove wallpaper in remote sessions to reduce changing pixels/bandwidth.
          New-ItemProperty -Path $policy -Name 'fNoRemoteDesktopWallpaper' `
            -PropertyType DWord -Value 1 -Force | Out-Null

          # Do NOT force AVC444 or hardware H.264 on this standard GitHub runner.
          # It has no discrete GPU; Windows' adaptive software graphics path is
          # generally the safer choice for this CPU/network combination.
          Remove-ItemProperty -Path $policy -Name 'AVC444ModePreferred' -ErrorAction SilentlyContinue
          Remove-ItemProperty -Path $policy -Name 'AVCHardwareEncodePreferred' -ErrorAction SilentlyContinue

          # ------------------------------------------------------------------
          # Reduce UI effects for the first rdpuser logon.
          # Edit the Default profile hive before rdpuser creates its profile.
          # ------------------------------------------------------------------
          $defaultHive = 'C:\Users\Default\NTUSER.DAT'
          $hiveLoaded = $false
          try {
            & reg.exe load 'HKU\RDPDefault' $defaultHive | Out-Null
            if ($LASTEXITCODE -eq 0) {
              $hiveLoaded = $true

              New-Item -Path 'Registry::HKEY_USERS\RDPDefault\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Force | Out-Null
              New-ItemProperty -Path 'Registry::HKEY_USERS\RDPDefault\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' `
                -Name 'EnableTransparency' -PropertyType DWord -Value 0 -Force | Out-Null

              New-Item -Path 'Registry::HKEY_USERS\RDPDefault\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' -Force | Out-Null
              New-ItemProperty -Path 'Registry::HKEY_USERS\RDPDefault\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' `
                -Name 'VisualFXSetting' -PropertyType DWord -Value 2 -Force | Out-Null

              New-Item -Path 'Registry::HKEY_USERS\RDPDefault\Control Panel\Desktop\WindowMetrics' -Force | Out-Null
              New-ItemProperty -Path 'Registry::HKEY_USERS\RDPDefault\Control Panel\Desktop\WindowMetrics' `
                -Name 'MinAnimate' -PropertyType String -Value '0' -Force | Out-Null

              New-Item -Path 'Registry::HKEY_USERS\RDPDefault\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced' -Force | Out-Null
              New-ItemProperty -Path 'Registry::HKEY_USERS\RDPDefault\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced' `
                -Name 'TaskbarAnimations' -PropertyType DWord -Value 0 -Force | Out-Null
            }
          } finally {
            if ($hiveLoaded) {
              [gc]::Collect()
              [gc]::WaitForPendingFinalizers()
              & reg.exe unload 'HKU\RDPDefault' | Out-Null
            }
          }

          # High performance power plan; never sleep during the workflow.
          powercfg /setactive SCHEME_MIN | Out-Null
          powercfg /change monitor-timeout-ac 0 | Out-Null
          powercfg /change standby-timeout-ac 0 | Out-Null

          # Apply local computer policies now.
          & gpupdate.exe /target:computer /force | Out-Null

          # ------------------------------------------------------------------
          # Tailscale-only firewall
          # ------------------------------------------------------------------
          $tsIP = (tailscale ip -4 | Select-Object -First 1).Trim()
          if (-not $tsIP) {
            throw 'Tailscale IPv4 address was not assigned.'
          }

          # Disable broad built-in RDP firewall rules.
          Get-NetFirewallRule -DisplayGroup 'Remote Desktop' -ErrorAction SilentlyContinue |
            Disable-NetFirewallRule -ErrorAction SilentlyContinue

          Get-NetFirewallRule -DisplayName 'RDP via Tailscale TCP' -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule -ErrorAction SilentlyContinue
          Get-NetFirewallRule -DisplayName 'RDP via Tailscale UDP' -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule -ErrorAction SilentlyContinue

          # Restrict both transports to the runner's Tailscale address and
          # Tailscale IPv4 peers only.
          New-NetFirewallRule -DisplayName 'RDP via Tailscale TCP' `
            -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389 `
            -LocalAddress $tsIP -RemoteAddress '100.64.0.0/10' -Profile Any | Out-Null

          New-NetFirewallRule -DisplayName 'RDP via Tailscale UDP' `
            -Direction Inbound -Action Allow -Protocol UDP -LocalPort 3389 `
            -LocalAddress $tsIP -RemoteAddress '100.64.0.0/10' -Profile Any | Out-Null

          # Restart the service before the first mobile RDP session.
          Restart-Service -Name TermService -Force
          Start-Sleep -Seconds 5

          $tcpListener = Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue
          if (-not $tcpListener) {
            throw 'RDP service is not listening on TCP 3389.'
          }

          $udpListener = Get-NetUDPEndpoint -LocalPort 3389 -ErrorAction SilentlyContinue

          $probe = Test-NetConnection -ComputerName $tsIP -Port 3389 -WarningAction SilentlyContinue
          if (-not $probe.TcpTestSucceeded) {
            throw "RDP is listening locally, but the Tailscale path $tsIP`:3389 failed."
          }

          Write-Host ''
          Write-Host '=== RDP 60FPS READY ==='
          Write-Host 'Tailscale hostname : gh-rdp'
          Write-Host "Tailscale IPv4     : $tsIP"
          Write-Host "RDP endpoint       : ${tsIP}:3389"
          Write-Host "Username           : $username"
          Write-Host 'Password           : use RDP_PASSWORD Environment secret'
          Write-Host 'FPS ceiling        : 60 (DWMFRAMEINTERVAL=15)'
          Write-Host 'Transport policy   : UDP or TCP'
          Write-Host "UDP 3389 listener  : $([bool]$udpListener)"
          Write-Host 'Graphics           : adaptive software encoding'
          Write-Host 'AVC444 forced      : no'
          Write-Host 'Wallpaper          : disabled in RDP session'
          Write-Host 'NLA                : enabled'
          Write-Host 'TLS security layer : enabled'
          Write-Host 'Firewall           : Tailscale IPv4 peers only'
          Write-Host 'Display resolution : negotiated by Windows App (no forced stretch)'
          Write-Host '======================='
          Write-Host ''
          Write-Host 'Windows App Android: use the Tailscale IP above, username rdpuser, and your RDP_PASSWORD.'

      - name: Keep RDP session available
        shell: pwsh
        run: |
          for ($i = 1; $i -le 69; $i++) {
            Write-Host "[$(Get-Date -Format o)] RDP 60FPS session active ($i/69)"
            Start-Sleep -Seconds 300
          }
          
