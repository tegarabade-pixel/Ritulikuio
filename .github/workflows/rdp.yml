name: Secure Windows RDP (Public Repo)

on:
  workflow_dispatch:

# This workflow does not need repository write/read access.
permissions: {}

# Prevent two RDP runners from being active at the same time.
concurrency:
  group: secure-windows-rdp
  cancel-in-progress: true

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    environment: rdp

    steps:
      # Pinned to tailscale/github-action v4.1.3 (immutable commit SHA).
      # Use an auth key that is reusable + ephemeral + pre-approved,
      # preferably with a dedicated tag such as tag:gh-rdp.
      - name: Connect runner to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: gh-rdp-${{ github.run_number }}
          log-mode: quiet

      - name: Configure secure Windows RDP
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw 'RDP_PASSWORD secret is missing.'
          }
          if ($env:RDP_PASSWORD.Length -lt 14) {
            throw 'RDP_PASSWORD must be at least 14 characters.'
          }

          # Extra masking in addition to GitHub Secrets masking.
          Write-Output "::add-mask::$env:RDP_PASSWORD"

          $username = 'rdpuser'
          $securePass = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          # Create/reset the temporary account for this ephemeral runner.
          $existing = Get-LocalUser -Name $username -ErrorAction SilentlyContinue
          if ($null -eq $existing) {
            New-LocalUser -Name $username -Password $securePass -AccountNeverExpires -PasswordNeverExpires | Out-Null
          } else {
            Set-LocalUser -Name $username -Password $securePass
          }

          # Keep admin capability from the original workflow, but only this
          # account is used for RDP and the VM is destroyed when the job ends.
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member $username -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group 'Administrators' -Member $username -ErrorAction SilentlyContinue

          # Enable RDP, require Network Level Authentication, and require TLS.
          $tsPath = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server'
          $rdpTcp  = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
          Set-ItemProperty -Path $tsPath -Name 'fDenyTSConnections' -Type DWord -Value 0 -Force
          Set-ItemProperty -Path $rdpTcp -Name 'UserAuthentication' -Type DWord -Value 1 -Force
          Set-ItemProperty -Path $rdpTcp -Name 'SecurityLayer' -Type DWord -Value 2 -Force

          # Get this runner's private Tailscale IPv4 address.
          $tsIP = (tailscale ip -4 | Select-Object -First 1).Trim()
          if (-not $tsIP) {
            throw 'Tailscale IPv4 address was not assigned.'
          }

          # Disable Windows' broad built-in RDP firewall rules.
          Get-NetFirewallRule -DisplayGroup 'Remote Desktop' -ErrorAction SilentlyContinue |
            Disable-NetFirewallRule -ErrorAction SilentlyContinue

          # Remove stale rules if this step is retried.
          Get-NetFirewallRule -DisplayName 'RDP via Tailscale TCP' -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule -ErrorAction SilentlyContinue
          Get-NetFirewallRule -DisplayName 'RDP via Tailscale UDP' -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule -ErrorAction SilentlyContinue

          # RDP is reachable only through this runner's Tailscale IP and only
          # from Tailscale IPv4 peers. TCP + UDP are allowed for better RDP performance.
          New-NetFirewallRule -DisplayName 'RDP via Tailscale TCP' `
            -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389 `
            -LocalAddress $tsIP -RemoteAddress '100.64.0.0/10' -Profile Any | Out-Null

          New-NetFirewallRule -DisplayName 'RDP via Tailscale UDP' `
            -Direction Inbound -Action Allow -Protocol UDP -LocalPort 3389 `
            -LocalAddress $tsIP -RemoteAddress '100.64.0.0/10' -Profile Any | Out-Null

          Restart-Service -Name TermService -Force
          Start-Sleep -Seconds 3

          $listener = Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue
          if (-not $listener) {
            throw 'RDP service is not listening on TCP 3389.'
          }

          Write-Host ''
          Write-Host '=== RDP READY ==='
          Write-Host "Tailscale hostname : gh-rdp-${{ github.run_number }}"
          Write-Host "Username           : $username"
          Write-Host 'Password           : use the RDP_PASSWORD GitHub Environment secret (never printed)'
          Write-Host 'Network            : Tailscale only'
          Write-Host 'NLA                : enabled'
          Write-Host 'TLS security layer : enabled'
          Write-Host '================='
          Write-Host ''
          Write-Host 'Open the Tailscale app to see the runner IP, then connect your RDP client to port 3389.'

      - name: Keep debugging session available
        shell: pwsh
        run: |
          # 69 x 5 minutes = 5h45m. This intentionally ends before GitHub's
          # 6-hour hosted-runner limit so the Tailscale action can clean up.
          for ($i = 1; $i -le 69; $i++) {
            Write-Host "[$(Get-Date -Format o)] RDP debugging session active ($i/69)"
            Start-Sleep -Seconds 300
          }
