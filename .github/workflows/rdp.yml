name: Secure RustDesk (Public Repo)

on:
  workflow_dispatch:

# No repository permissions are needed.
permissions: {}

concurrency:
  group: secure-rustdesk
  cancel-in-progress: true

jobs:
  rustdesk:
    runs-on: windows-latest
    timeout-minutes: 360
    environment: rdp

    steps:
      - name: Connect runner to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: gh-rustdesk-${{ github.run_number }}
          log-mode: quiet

      - name: Install and secure RustDesk
        shell: pwsh
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:RUSTDESK_PASSWORD)) {
            throw 'RDP_PASSWORD environment secret is missing.'
          }
          if ($env:RUSTDESK_PASSWORD.Length -lt 12) {
            throw 'RDP_PASSWORD must be at least 12 characters.'
          }
          Write-Output "::add-mask::$env:RUSTDESK_PASSWORD"

          $tsIP = (tailscale ip -4 | Select-Object -First 1).Trim()
          if (-not $tsIP) {
            throw 'Tailscale IPv4 address was not assigned.'
          }

          Write-Host 'Downloading latest RustDesk x86-64 release...'
          $headers = @{ 'User-Agent' = 'GitHub-Actions-RustDesk-Setup' }
          $release = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/rustdesk/rustdesk/releases/latest'
          $asset = $release.assets | Where-Object { $_.name -match '^rustdesk-.*-x86_64\.exe$' } | Select-Object -First 1
          if (-not $asset) {
            throw 'Could not find the RustDesk Windows x86-64 installer in the latest release.'
          }

          $installer = Join-Path $env:RUNNER_TEMP 'rustdesk-installer.exe'
          Invoke-WebRequest -Headers $headers -Uri $asset.browser_download_url -OutFile $installer

          Write-Host "Installing RustDesk $($release.tag_name)..."
          Start-Process -FilePath $installer -ArgumentList '--silent-install' -Wait
          Start-Sleep -Seconds 10

          $rustdesk = 'C:\Program Files\RustDesk\rustdesk.exe'
          if (-not (Test-Path $rustdesk)) {
            throw 'RustDesk executable was not found after installation.'
          }

          # Ensure service mode is installed so unattended access works.
          & $rustdesk --install-service | Out-Null
          Start-Sleep -Seconds 8

          $service = Get-Service -Name 'RustDesk' -ErrorAction SilentlyContinue
          if (-not $service) {
            throw 'RustDesk Windows service was not created.'
          }

          # Set the permanent password without printing it.
          & $rustdesk --password $env:RUSTDESK_PASSWORD | Out-Null

          # Configure the installed/service instance. Pointing the ID server to
          # localhost disables the public rendezvous path; access is by Tailscale
          # direct-IP only.
          Stop-Service -Name 'RustDesk' -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          $configDir = 'C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\RustDesk\config'
          New-Item -ItemType Directory -Path $configDir -Force | Out-Null
          $configFile = Join-Path $configDir 'RustDesk2.toml'

          $configLines = @(
            "rendezvous_server = '127.0.0.1:21116'"
            'nat_type = 1'
            'serial = 0'
            ''
            '[options]'
            "direct-server = 'Y'"
            "direct-access-port = '21118'"
            "approve-mode = 'password'"
            "verification-method = 'use-permanent-password'"
            "allow-logon-screen-password = 'Y'"
            "allow-only-conn-window-open = 'N'"
            "enable-lan-discovery = 'N'"
            "whitelist = '100.64.0.0/10'"
            "enable-keyboard = 'Y'"
            "enable-clipboard = 'Y'"
            "enable-file-transfer = 'Y'"
            "enable-audio = 'Y'"
          )
          Set-Content -Path $configFile -Value $configLines -Encoding UTF8

          # Disable any broad installer-created inbound rules, then allow only
          # the fixed RustDesk direct-access port via the runner's Tailscale IP.
          Get-NetFirewallRule -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like '*RustDesk*' } |
            Disable-NetFirewallRule -ErrorAction SilentlyContinue

          Get-NetFirewallRule -DisplayName 'RustDesk via Tailscale' -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule -ErrorAction SilentlyContinue

          New-NetFirewallRule -DisplayName 'RustDesk via Tailscale' `
            -Direction Inbound -Action Allow -Protocol TCP -LocalPort 21118 `
            -LocalAddress $tsIP -RemoteAddress '100.64.0.0/10' -Profile Any | Out-Null

          Start-Service -Name 'RustDesk'

          # Re-apply the password after service start to ensure the installed
          # service profile receives it.
          Start-Sleep -Seconds 5
          & $rustdesk --password $env:RUSTDESK_PASSWORD | Out-Null
          Restart-Service -Name 'RustDesk' -Force

          $ready = $false
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Seconds 2
            $listener = Get-NetTCPConnection -LocalPort 21118 -State Listen -ErrorAction SilentlyContinue
            if ($listener) {
              $ready = $true
              break
            }
          }
          if (-not $ready) {
            Get-Service -Name 'RustDesk' | Format-List | Out-String | Write-Host
            throw 'RustDesk direct-access listener did not open on TCP 21118.'
          }

          Write-Host ''
          Write-Host '=== RUSTDESK READY ==='
          Write-Host "Tailscale hostname : gh-rustdesk-${{ github.run_number }}"
          Write-Host "Tailscale IPv4     : $tsIP"
          Write-Host 'RustDesk endpoint  : Tailscale-IP:21118'
          Write-Host 'Password           : use the existing RDP_PASSWORD Environment secret'
          Write-Host 'Public ID/relay    : disabled (ID server -> 127.0.0.1)'
          Write-Host 'Firewall           : Tailscale IPv4 peers only'
          Write-Host '======================='

      - name: Keep RustDesk session available
        shell: pwsh
        run: |
          # 69 x 5 minutes = 5h45m, leaving cleanup time before GitHub's
          # 6-hour hosted-runner maximum.
          for ($i = 1; $i -le 69; $i++) {
            Write-Host "[$(Get-Date -Format o)] RustDesk session active ($i/69)"
            Start-Sleep -Seconds 300
          }
