name: Secure Jump Fluid (Public Repo) v2

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: secure-jump-fluid
  cancel-in-progress: true

jobs:
  fluid:
    runs-on: windows-latest
    timeout-minutes: 360
    environment: rdp

    steps:
      - name: Prepare temporary Windows account
        shell: pwsh
        env:
          FLUID_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:FLUID_PASSWORD)) {
            throw 'RDP_PASSWORD Environment secret is missing.'
          }
          if ($env:FLUID_PASSWORD.Length -lt 14) {
            throw 'RDP_PASSWORD must be at least 14 characters.'
          }

          Write-Output "::add-mask::$env:FLUID_PASSWORD"

          $username = 'fluiduser'
          $securePass = ConvertTo-SecureString $env:FLUID_PASSWORD -AsPlainText -Force

          $existing = Get-LocalUser -Name $username -ErrorAction SilentlyContinue
          if ($null -eq $existing) {
            New-LocalUser -Name $username -Password $securePass `
              -AccountNeverExpires -PasswordNeverExpires | Out-Null
          } else {
            Set-LocalUser -Name $username -Password $securePass
          }

          Add-LocalGroupMember -Group 'Administrators' -Member $username -ErrorAction SilentlyContinue
          Write-Host 'Temporary Windows account ready: fluiduser'

      - name: Install Jump Desktop Connect with Fluid
        shell: pwsh
        env:
          JUMP_CONNECT_CODE: ${{ secrets.JUMP_CONNECT_CODE }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:JUMP_CONNECT_CODE)) {
            throw 'JUMP_CONNECT_CODE Environment secret is missing.'
          }

          Write-Output "::add-mask::$env:JUMP_CONNECT_CODE"
          $connectCode = ($env:JUMP_CONNECT_CODE -replace '\s','')

          $installer = Join-Path $env:RUNNER_TEMP 'JumpDesktopConnect-10.15.23.exe'
          $url = 'https://jumpdesktop.com/downloads/connect/JumpDesktopConnect-10.15.23.exe'

          Write-Host 'Downloading Jump Desktop Connect 10.15.23...'
          Invoke-WebRequest -Uri $url -OutFile $installer

          # Officially supported installer variables:
          # CONNECTCODE adds the machine to the Jump account,
          # FLUIDENABLED enables Fluid, RDPENABLED disables RDP tunnelling.
          Write-Host 'Installing Jump Desktop Connect and attaching it to your account...'
          $installArgs = @(
            '/qn'
            "CONNECTCODE=$connectCode"
            'FLUIDENABLED=true'
            'RDPENABLED=false'
          )

          $p = Start-Process -FilePath $installer -ArgumentList $installArgs -PassThru
          if (-not $p.WaitForExit(180000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'Jump Desktop Connect installation timed out after 3 minutes.'
          }
          if ($p.ExitCode -ne 0) {
            throw "Jump Desktop Connect installer failed with exit code $($p.ExitCode)."
          }

          $regPath = 'HKLM:\SOFTWARE\Jump Desktop\Connect\Shared'
          $connectPath = $null

          for ($i = 0; $i -lt 30; $i++) {
            try {
              $connectPath = (Get-ItemProperty $regPath -ErrorAction Stop).ConnectPath
            } catch {
              $connectPath = $null
            }
            if ($connectPath -and (Test-Path $connectPath)) { break }
            Start-Sleep -Seconds 2
          }

          if (-not $connectPath -or -not (Test-Path $connectPath)) {
            throw 'JumpConnect.exe was not found after installation.'
          }

          Write-Host "JumpConnect path: $connectPath"

          # Best-effort hardening / naming.
          # Some Jump Connect 10 builds return a non-zero exit code for
          # --serverconfig even when installation/account attachment is healthy,
          # so these are intentionally not used as fatal readiness checks.
          & $connectPath --serverconfig ComputerName=gh-fluid
          Write-Host "ComputerName config exit code: $LASTEXITCODE"

          & $connectPath --serverconfig VNCEnabled=0
          Write-Host "VNC disable exit code: $LASTEXITCODE"

          & $connectPath --serverconfig RTCEnabled=1
          Write-Host "Fluid enable exit code: $LASTEXITCODE"

          & $connectPath --serverconfig RtcLocalServer=0
          Write-Host "Manual Fluid server disable exit code: $LASTEXITCODE"

          Start-Sleep -Seconds 20

          $jumpProcesses = Get-Process -ErrorAction SilentlyContinue |
            Where-Object { $_.ProcessName -match 'Jump|Fluid' }

          if (-not $jumpProcesses) {
            throw 'Jump Desktop Connect is not running after installation.'
          }

          Write-Host ''
          Write-Host '=== JUMP FLUID READY ==='
          Write-Host 'Protocol            : Fluid'
          Write-Host 'RDP tunnel          : disabled'
          Write-Host 'Windows username    : fluiduser'
          Write-Host 'Windows password    : use the existing RDP_PASSWORD Environment secret'
          Write-Host 'Authentication      : your Jump Desktop account'
          Write-Host 'Computer display    : look for the newest ONLINE computer in Jump Desktop'
          Write-Host '========================'
          Write-Host ''
          Write-Host 'Open Jump Desktop Android, sign in to the same account, and select the newest ONLINE computer.'

      - name: Keep Fluid session available
        shell: pwsh
        run: |
          for ($i = 1; $i -le 69; $i++) {
            Write-Host "[$(Get-Date -Format o)] Jump Fluid session active ($i/69)"
            Start-Sleep -Seconds 300
          }
          
